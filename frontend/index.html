<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Short URL Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Short URL Manager</h2>

    <!-- Create Short URL -->
    <form id="createForm" class="mb-4">
      <input type="url" class="form-control mb-2" name="originalUrl" placeholder="Original URL" required />
      <button class="btn btn-primary">Create</button>
    </form>

    <!-- Retrieve Original URL -->
    <form id="getUrlForm" class="mb-4">
      <input type="text" class="form-control mb-2" name="shortCode" placeholder="Enter short code" required />
      <button class="btn btn-success">Open Original URL</button>
    </form>

    <!-- Get URL Stats -->
    <form id="statsForm" class="mb-4">
      <input type="text" class="form-control mb-2" name="statShortCode" placeholder="Enter short code for stats" required />
      <button class="btn btn-info">Get Stats</button>
    </form>

    <div id="statsResult" class="mb-4 text-muted"></div>

    <!-- URLs Table -->
    <table class="table table-bordered d-none" id="urlTable">
      <thead>
        <tr>
          <th>Original URL</th>
          <th>Short Code</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="urlList"></tbody>
    </table>
  </div>

  <script>
    const table = document.getElementById("urlTable");
    const tbody = document.getElementById("urlList");
    const statsResult = document.getElementById("statsResult");

    async function fetchAllUrls() {
      const res = await fetch("http://localhost:5000/short/all");
      const result = await res.json();
      const data = result.Urls || [];
      tbody.innerHTML = "";
      if (data.length === 0) {
        table.classList.add("d-none");
        return;
      }

      data.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><input type="text" class="form-control" value="${item.url}" id="url-${item._id}" /></td>
          <td>${item.shortCode}</td>
          <td><button class="btn btn-warning btn-sm" onclick="updateUrl('${item._id}')">Update</button></td>
          <td><button class="btn btn-danger btn-sm" onclick="deleteUrl('${item._id}')">Delete</button></td>
        `;
        tbody.appendChild(row);
      });
      table.classList.remove("d-none");
    }

    document.getElementById("createForm").addEventListener("submit", async e => {
      e.preventDefault();
      const originalUrl = e.target.originalUrl.value;
      await fetch("http://localhost:5000/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ originalUrl }),
      });
      e.target.reset();
      fetchAllUrls();
    });

    async function updateUrl(id) {
      await fetch(`http://localhost:5000/shorten/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
      });
      fetchAllUrls();
    }

    async function deleteUrl(id) {
      await fetch(`http://localhost:5000/shorten/${id}`, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
      });
      fetchAllUrls();
    }

    document.getElementById("getUrlForm").addEventListener("submit", async e => {
      e.preventDefault();
      const shortCode = e.target.shortCode.value.trim();
      try {
        const res = await fetch(`http://localhost:5000/shorten/${shortCode}`);
        if (!res.ok) throw new Error("Not Found");
        const data = await res.json();
        window.open(data.urlDoc.url, "_blank");
      } catch (err) {
        alert("Original URL not found.");
      }
    });

    document.getElementById("statsForm").addEventListener("submit", async e => {
      e.preventDefault();
      const shortCode = e.target.statShortCode.value.trim();
      try {
        const res = await fetch(`http://localhost:5000/shorten/stats/${shortCode}`);
        if (!res.ok) throw new Error("Not Found");
        const data = await res.json();
        statsResult.innerHTML = `
          <strong>Stats:</strong><br/>
          ID: ${data.id}<br/>
          Original URL: ${data.url}<br/>
          Short Code: ${data.shortCode}<br/>
          Created At: ${new Date(data.createdAt).toLocaleString()}<br/>
          Updated At: ${new Date(data.updatedAt).toLocaleString()}<br/>
          Click Count: ${data.accessCount}
        `;
      } catch (err) {
        statsResult.innerText = "Stats not found.";
      }
    });

    fetchAllUrls();
  </script>
</body>
</html>
